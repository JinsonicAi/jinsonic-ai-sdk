site_name: AIBox SDK 文档
site_description: AIBox 边缘智能算法平台 SDK、插件开发、算法能力与部署交付文档
site_author: Jinsonic
site_url: https://aibox-sdk-docs.readthedocs.io/zh-cn/latest/
repo_name: jinsonic-ai-sdk

theme:
  name: material
  language: zh
  font: false
  icon:
    repo: fontawesome/brands/git-alt
    admonition:
      note: material/pencil-circle
      tip: material/lightbulb-on
      warning: material/alert
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

extra:
  alternate:
    - name: 简体中文
      link: https://aibox-sdk-docs.readthedocs.io/zh-cn/latest/
      lang: zh
    - name: English
      link: https://aibox-sdk-docs.readthedocs.io/zh-cn/latest/en/
      lang: en

extra_css:
  - stylesheets/extra.css
  - stylesheets/sop-manual.css

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
  - javascripts/mermaid.js
  - javascripts/cloudflare-analytics.js

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: 本页目录
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.critic
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

