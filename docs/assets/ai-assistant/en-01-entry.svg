<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc"><title id="title">Find the AI assistant in the device header</title><desc id="desc">English entry-point diagram. The AI button is immediately to the left of Search.</desc><rect width="1280" height="390" rx="20" fill="#eef0f5"/><rect x="24" y="24" width="1232" height="82" rx="16" fill="white"/><g font-family="Arial,sans-serif"><text x="54" y="73" fill="#24242a" font-size="24" font-weight="700">AI-BOX</text><circle cx="173" cy="67" r="5" fill="#24a46a"/><text x="188" y="73" font-size="15" fill="#62626e">Online</text><rect x="711" y="42" width="97" height="46" rx="14" fill="#f2e6fb" stroke="#913ac0" stroke-width="2"/><text x="739" y="72" font-size="20" font-weight="700" fill="#913ac0">AI</text><text x="840" y="72" font-size="16" fill="#62626e">Search</text><text x="955" y="72" font-size="16" fill="#62626e">EN</text><text x="1030" y="72" font-size="22" fill="#62626e">+</text><text x="1120" y="72" font-size="16" fill="#62626e">Settings</text><path d="M760 190V113m-8 10 8-10 8 10" fill="none" stroke="#913ac0" stroke-width="3"/><text x="54" y="189" font-size="12" letter-spacing="2" fill="#737383">ENTRY-POINT DIAGRAM</text><text x="54" y="237" font-size="29" font-weight="700" fill="#24242a">Open the AI assistant</text><text x="54" y="279" font-size="18" fill="#555565">1. Sign in to your device.   2. Wait for connection.   3. Select AI, beside Search.</text><text x="54" y="337" font-size="13" fill="#737383">English navigation diagram based on the device header. This is an illustration, not a live screenshot.</text></g></svg>